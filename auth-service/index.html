<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Real Estate Management</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="/" class="logo">RealEstate</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="auth-container">
            <h1>Welcome back</h1>
            <p class="text-secondary">Log in to your account to continue</p>

            <form id="loginForm" class="mt-lg">
                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="yourname@example.com"
                        required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input"
                        placeholder="Enter your password" required>
                </div>

                <!-- Forgot Password -->
                <div class="text-right mb-lg">
                    <a href="#" class="link-muted">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">
                    Log in
                </button>
            </form>

            <!-- Divider -->
            <div class="divider-text mt-xl">
                <span>or</span>
            </div>

            <!-- Sign Up Link -->
            <div class="text-center mt-lg">
                <p class="text-secondary">
                    Don't have an account?
                    <a href="/register.html" class="link">Sign up</a>
                </p>
            </div>
        </main>
    </div>

    <script src="/public/js/login.js"></script>
</body>

</html>
